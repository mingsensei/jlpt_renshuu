<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow_topic_02" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#16a34a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_02)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#16a34a">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#16a34a"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 02</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Phân loại rác & Chung cư</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="end">ゴミ分別・マンション</text>

  <!-- Main Illustration Scene -->
  
            <!-- Recycling Bins -->
            <g transform="translate(130, 140)">
                <!-- Bin 1: Burnable (Red) -->
                <rect x="0" y="30" width="130" height="170" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
                <rect x="-10" y="10" width="150" height="25" rx="8" fill="#ef4444"/>
                <text x="65" y="110" font-size="28" text-anchor="middle">🔥</text>
                <text x="65" y="150" font-size="16" font-family="sans-serif" font-weight="bold" fill="#b91c1c" text-anchor="middle">燃えるゴミ</text>
            </g>
            <g transform="translate(330, 140)">
                <!-- Bin 2: Non-burnable (Blue) -->
                <rect x="0" y="30" width="130" height="170" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
                <rect x="-10" y="10" width="150" height="25" rx="8" fill="#0284c7"/>
                <text x="65" y="110" font-size="28" text-anchor="middle">❄️</text>
                <text x="65" y="150" font-size="16" font-family="sans-serif" font-weight="bold" fill="#0369a1" text-anchor="middle">燃えない</text>
            </g>
            <g transform="translate(530, 140)">
                <!-- Bin 3: PET bottle (Green) -->
                <rect x="0" y="30" width="130" height="170" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
                <rect x="-10" y="10" width="150" height="25" rx="8" fill="#16a34a"/>
                <text x="65" y="110" font-size="28" text-anchor="middle">🍾</text>
                <text x="65" y="150" font-size="16" font-family="sans-serif" font-weight="bold" fill="#15803d" text-anchor="middle">資源ゴミ</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#16a34a"/>
</svg>
