<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow_topic_09" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4338ca" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_09)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#4338ca">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#4338ca"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 09</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Học tập, Thi cử & Deadline</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#4338ca" text-anchor="end">学校・授業・締め切り</text>

  <!-- Main Illustration Scene -->
  
            <!-- Clock & Deadline Calendar -->
            <g transform="translate(160, 130)">
                <circle cx="80" cy="80" r="75" fill="#ffffff" stroke="#ef4444" stroke-width="8" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.08))"/>
                <line x1="80" y1="80" x2="80" y2="30" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
                <line x1="80" y1="80" x2="120" y2="80" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
                <text x="80" y="125" font-size="14" font-family="sans-serif" font-weight="black" fill="#ef4444" text-anchor="middle">23:59 〆</text>
            </g>
            <g transform="translate(420, 110)">
                <rect x="0" y="0" width="220" height="200" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.08))"/>
                <rect x="0" y="0" width="220" height="45" rx="16" fill="#4338ca"/>
                <text x="110" y="30" font-size="16" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">DEADLINE</text>
                <circle cx="110" cy="115" r="30" fill="none" stroke="#ef4444" stroke-width="5"/>
                <text x="110" y="125" font-size="26" font-weight="bold" fill="#ef4444" text-anchor="middle">提出</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#4338ca"/>
</svg>
