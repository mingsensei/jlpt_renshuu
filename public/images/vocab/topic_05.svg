<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <filter id="shadow_topic_05" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#c026d3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_05)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#c026d3">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#c026d3"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 05</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Văn hóa công sở & Hourensou</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#c026d3" text-anchor="end">職場マナー・報連相</text>

  <!-- Main Illustration Scene -->
  
            <!-- Hourensou 3 Pillars -->
            <g transform="translate(110, 130)">
                <rect x="0" y="0" width="170" height="180" rx="18" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(192,38,211,0.12))"/>
                <text x="85" y="55" font-size="34" text-anchor="middle">📢</text>
                <text x="85" y="100" font-size="22" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#c026d3" text-anchor="middle">報 告</text>
                <text x="85" y="135" font-size="13" font-family="sans-serif" font-weight="bold" fill="#6b7280" text-anchor="middle">Báo cáo kết quả</text>
            </g>
            <g transform="translate(315, 130)">
                <rect x="0" y="0" width="170" height="180" rx="18" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(192,38,211,0.12))"/>
                <text x="85" y="55" font-size="34" text-anchor="middle">💬</text>
                <text x="85" y="100" font-size="22" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#c026d3" text-anchor="middle">連 絡</text>
                <text x="85" y="135" font-size="13" font-family="sans-serif" font-weight="bold" fill="#6b7280" text-anchor="middle">Liên lạc tiến độ</text>
            </g>
            <g transform="translate(520, 130)">
                <rect x="0" y="0" width="170" height="180" rx="18" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(192,38,211,0.12))"/>
                <text x="85" y="55" font-size="34" text-anchor="middle">🤝</text>
                <text x="85" y="100" font-size="22" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#c026d3" text-anchor="middle">相 談</text>
                <text x="85" y="135" font-size="13" font-family="sans-serif" font-weight="bold" fill="#6b7280" text-anchor="middle">Xin ý kiến sếp</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#c026d3"/>
</svg>
