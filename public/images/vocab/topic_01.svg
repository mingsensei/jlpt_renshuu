<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow_topic_01" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_01)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#4f46e5">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#4f46e5"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 01</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Tìm phòng & Thuê nhà</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#4f46e5" text-anchor="end">部屋探し・賃貸</text>

  <!-- Main Illustration Scene -->
  
            <!-- Apartment building & Room -->
            <rect x="120" y="110" width="220" height="240" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(79,70,229,0.15))"/>
            <rect x="145" y="140" width="50" height="50" rx="8" fill="#e0e7ff"/>
            <rect x="205" y="140" width="50" height="50" rx="8" fill="#e0e7ff"/>
            <rect x="265" y="140" width="50" height="50" rx="8" fill="#e0e7ff"/>
            <rect x="145" y="210" width="50" height="50" rx="8" fill="#e0e7ff"/>
            <rect x="205" y="210" width="50" height="50" rx="8" fill="#c7d2fe"/>
            <rect x="265" y="210" width="50" height="50" rx="8" fill="#e0e7ff"/>
            <rect x="195" y="280" width="70" height="70" rx="8" fill="#4f46e5"/>
            <!-- Contract Paper & Key -->
            <rect x="420" y="130" width="260" height="200" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.08))"/>
            <path d="M450 160 H600 M450 190 H640 M450 220 H580 M450 250 H620" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
            <circle cx="610" cy="270" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
            <text x="610" y="277" font-size="16" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#ef4444" text-anchor="middle">印</text>
            <!-- Golden Key -->
            <g transform="translate(380, 240) rotate(-30)">
                <circle cx="40" cy="40" r="24" fill="none" stroke="#f59e0b" stroke-width="10"/>
                <path d="M64 40 H130 M110 40 V55 M125 40 V58" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#4f46e5"/>
</svg>
