<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow_topic_16" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#c2410c" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_16)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#c2410c">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#c2410c"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 16</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Nấu ăn & An toàn thực phẩm</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">料理・調味料・食品安全</text>

  <!-- Main Illustration Scene -->
  
            <!-- Cooking pot & Scallion knife -->
            <g transform="translate(140, 120)">
                <rect x="0" y="40" width="180" height="110" rx="14" fill="#c2410c"/>
                <path d="M-20 70 H0 M180 70 H200" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
                <text x="90" y="105" font-size="44" text-anchor="middle">🍲</text>
                <text x="90" y="175" font-size="16" font-family="sans-serif" font-weight="bold" fill="#c2410c" text-anchor="middle">煮る・焼く・炒める</text>
            </g>
            <g transform="translate(420, 120)">
                <rect x="0" y="0" width="240" height="170" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
                <text x="120" y="45" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#1e293b" text-anchor="middle">賞味期限 vs 消費期限</text>
                <text x="60" y="105" font-size="28" text-anchor="middle">😋</text>
                <text x="60" y="135" font-size="12" font-family="sans-serif" font-weight="bold" fill="#15803d" text-anchor="middle">Hạn ngon</text>
                <text x="180" y="105" font-size="28" text-anchor="middle">⚠️</text>
                <text x="180" y="135" font-size="12" font-family="sans-serif" font-weight="bold" fill="#dc2626" text-anchor="middle">Hạn an toàn</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#c2410c"/>
</svg>
