<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <filter id="shadow_topic_10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a21caf" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_10)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#a21caf">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#a21caf"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 10</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Câu lạc bộ & Lễ hội trường</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#a21caf" text-anchor="end">サークル活動・学園祭</text>

  <!-- Main Illustration Scene -->
  
            <!-- Festival Tent & Food Stall -->
            <polygon points="120,200 280,100 440,200" fill="#f43f5e"/>
            <polygon points="120,200 160,200 140,110" fill="#ffffff"/>
            <polygon points="200,200 240,200 220,105" fill="#ffffff"/>
            <polygon points="280,200 320,200 300,105" fill="#ffffff"/>
            <polygon points="360,200 400,200 380,110" fill="#ffffff"/>
            <rect x="140" y="200" width="280" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
            <text x="280" y="260" font-size="36" text-anchor="middle">🐙 屋台</text>
            <!-- Megaphone & Music -->
            <g transform="translate(520, 160)">
                <text x="60" y="40" font-size="48" text-anchor="middle">🎸</text>
                <text x="120" y="90" font-size="32" text-anchor="middle">🎉</text>
                <text x="60" y="120" font-size="16" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#a21caf" text-anchor="middle">新入生歓迎!</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#a21caf"/>
</svg>
