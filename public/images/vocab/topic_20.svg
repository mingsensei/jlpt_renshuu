  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="end">時間管理・計画性</text>

  <!-- Main Illustration Scene -->
  
            <!-- Hourglass & Checklist -->
