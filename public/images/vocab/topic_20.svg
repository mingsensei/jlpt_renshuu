            </g>
            <g transform="translate(380, 110)">
                <rect x="0" y="0" width="250" height="190" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
                <g transform="translate(30, 35)">
                    <circle cx="15" cy="15" r="12" fill="#dcfce7"/>
