<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow_topic_15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15803d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_15)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#15803d">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#15803d"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 15</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Sức khỏe & Thể dục & Phòng bệnh</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#15803d" text-anchor="end">健康管理・予防・運動</text>

  <!-- Main Illustration Scene -->
  
            <!-- Runner & Heart Health -->
            <g transform="translate(140, 130)">
                <text x="80" y="80" font-size="64" text-anchor="middle">🏃‍♂️</text>
                <text x="80" y="130" font-size="16" font-family="sans-serif" font-weight="bold" fill="#15803d" text-anchor="middle">毎日8000歩</text>
            </g>
            <g transform="translate(380, 130)">
                <rect x="0" y="0" width="260" height="160" rx="18" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
                <path d="M30 80 H80 L95 40 L115 120 L135 60 L150 90 L160 80 H230" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
                <text x="130" y="130" font-size="15" font-family="sans-serif" font-weight="bold" fill="#15803d" text-anchor="middle">栄養バランス・免疫力UP</text>
            </g>
        

