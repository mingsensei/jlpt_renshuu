<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow_topic_08" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#d97706" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_08)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#d97706">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#d97706"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 08</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Mua sắm online & Giao hàng</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="end">買い物・ネット通販・宅配便</text>

  <!-- Main Illustration Scene -->
  
            <!-- Delivery Truck & Cardboard Box -->
            <g transform="translate(130, 140)">
                <!-- Truck body -->
                <rect x="0" y="30" width="180" height="110" rx="12" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.08))"/>
                <rect x="180" y="65" width="70" height="75" rx="8" fill="#d97706"/>
                <rect x="200" y="75" width="40" height="35" rx="4" fill="#fef3c7"/>
                <circle cx="50" cy="140" r="24" fill="#334155"/>
                <circle cx="50" cy="140" r="10" fill="#94a3b8"/>
                <circle cx="190" cy="140" r="24" fill="#334155"/>
                <circle cx="190" cy="140" r="10" fill="#94a3b8"/>
                <text x="90" y="95" font-size="28" text-anchor="middle">🚚 宅配便</text>
            </g>
            <!-- Big Parcel Box -->
            <g transform="translate(480, 150)">
                <rect x="0" y="20" width="180" height="140" rx="12" fill="#d97706"/>
                <polygon points="0,20 90,0 180,20 90,40" fill="#f59e0b"/>
                <rect x="75" y="40" width="30" height="120" fill="#b45309"/>
                <text x="90" y="115" font-size="34" text-anchor="middle">📦</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#d97706"/>
</svg>
