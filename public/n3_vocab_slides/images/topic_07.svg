<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <filter id="shadow_topic_07" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#dc2626" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_07)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#dc2626">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#dc2626"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 07</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Khám bệnh & Y tế & Uống thuốc</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="end">病院・診察・薬</text>

  <!-- Main Illustration Scene -->
  
            <!-- Stethoscope & Medicine -->
            <rect x="140" y="120" width="220" height="220" rx="20" fill="#ffffff" filter="drop-shadow(0 15px 25px rgba(220,38,38,0.12))"/>
            <!-- Red Cross -->
            <rect x="225" y="160" width="50" height="140" fill="#dc2626" rx="8"/>
            <rect x="180" y="205" width="140" height="50" fill="#dc2626" rx="8"/>
            <!-- Prescription & Pills -->
            <g transform="translate(420, 130)">
                <rect x="0" y="0" width="240" height="180" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.08))"/>
                <text x="120" y="40" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#dc2626" text-anchor="middle">処 方 箋</text>
                <path d="M30 70 H210 M30 100 H160 M30 130 H190" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round"/>
                <!-- Pill capsule -->
                <g transform="translate(170, 95) rotate(45)">
                    <rect x="0" y="0" width="20" height="40" rx="10" fill="#dc2626"/>
                    <rect x="0" y="20" width="20" height="20" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
                </g>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#dc2626"/>
</svg>
