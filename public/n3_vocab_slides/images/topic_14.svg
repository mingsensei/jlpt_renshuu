<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <filter id="shadow_topic_14" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4d7c0f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_14)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#4d7c0f">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#4d7c0f"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 14</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Động vật & Tự nhiên sinh thái</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#4d7c0f" text-anchor="end">動物の生態・自然環境</text>

  <!-- Main Illustration Scene -->
  
            <!-- Eagle & Wildlife Deer -->
            <g transform="translate(140, 130)">
                <text x="100" y="70" font-size="64" text-anchor="middle">🦅</text>
                <text x="100" y="125" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#4d7c0f" text-anchor="middle">捕食者 (ワシ)</text>
            </g>
            <g transform="translate(450, 130)">
                <text x="100" y="70" font-size="64" text-anchor="middle">🦌</text>
                <text x="100" y="125" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#4d7c0f" text-anchor="middle">草食動物 (シカ)</text>
            </g>
            <path d="M290 200 H390" stroke="#84cc16" stroke-width="4" stroke-dasharray="6,6"/>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#4d7c0f"/>
