  <!-- Main Illustration Scene -->
  
            <!-- Resume Document & Interview -->
            <rect x="130" y="100" width="240" height="250" rx="16" fill="#ffffff" filter="drop-shadow(0 15px 25px rgba(234,88,12,0.15))"/>
