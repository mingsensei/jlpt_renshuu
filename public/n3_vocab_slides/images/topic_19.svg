<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_19" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadow_topic_19" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_19)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#e11d48">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#e11d48"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 19</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Quà tặng & Phong tục Omiyage</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#e11d48" text-anchor="end">お土産・贈り物文化</text>

  <!-- Main Illustration Scene -->
  
            <!-- Omiyage Gift Box with Noshi Ribbon -->
            <g transform="translate(160, 120)">
                <rect x="0" y="40" width="180" height="140" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(225,29,72,0.15))"/>
                <rect x="0" y="20" width="180" height="30" rx="6" fill="#e11d48"/>
                <rect x="75" y="20" width="30" height="160" fill="#e11d48"/>
                <!-- Mizuhiki Bow -->
                <text x="90" y="10" font-size="34" text-anchor="middle">🎀</text>
                <text x="90" y="120" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#e11d48" text-anchor="middle">御 礼</text>
            </g>
            <g transform="translate(420, 130)">
                <text x="100" y="70" font-size="52" text-anchor="middle">🍪 🍡 🥮</text>
                <text x="100" y="125" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#e11d48" text-anchor="middle">地方の名物お菓子</text>
                <text x="100" y="155" font-size="13" font-family="sans-serif" font-weight="bold" fill="#64748b" text-anchor="middle">Bánh đặc sản chia đều</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#e11d48"/>
</svg>
