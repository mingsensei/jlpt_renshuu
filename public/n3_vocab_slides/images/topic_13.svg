  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Thiên tai & Cứu hộ & Sơ tán</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">自然災害・地震・防災</text>

  <!-- Main Illustration Scene -->
  
            <!-- Seismograph & Emergency Backpack -->
            <g transform="translate(130, 140)">
