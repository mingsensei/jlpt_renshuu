<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow_topic_18" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_18)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#334155">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#334155"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 18</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Từ chối khéo & Kỹ năng xin lỗi</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="end">断り方・お詫び・マナー</text>

  <!-- Main Illustration Scene -->
  
            <!-- Polite Bow & Japanese Tea -->
            <g transform="translate(150, 120)">
                <rect x="0" y="0" width="220" height="180" rx="18" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
                <text x="110" y="65" font-size="44" text-anchor="middle">🙇‍♂️</text>
                <text x="110" y="115" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#334155" text-anchor="middle">お詫び・恐縮</text>
                <text x="110" y="145" font-size="12" font-family="sans-serif" font-weight="bold" fill="#64748b" text-anchor="middle">Xin lỗi lịch sự chuẩn mực</text>
            </g>
            <g transform="translate(430, 120)">
                <rect x="0" y="0" width="220" height="180" rx="18" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))"/>
                <text x="110" y="65" font-size="44" text-anchor="middle">🍵</text>
                <text x="110" y="115" font-size="18" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#334155" text-anchor="middle">遠慮・配慮</text>
                <text x="110" y="145" font-size="12" font-family="sans-serif" font-weight="bold" fill="#64748b" text-anchor="middle">Từ chối khéo léo giữ kẽ</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#334155"/>
</svg>
