<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow_topic_17" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d4ed8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_17)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#1d4ed8">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#1d4ed8"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 17</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Smartphone & Mạng xã hội</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="end">スマホ・SNS・デジタル</text>

  <!-- Main Illustration Scene -->
  
            <!-- Smartphone Device -->
            <g transform="translate(180, 80)">
                <rect x="0" y="0" width="160" height="270" rx="28" fill="#1e293b" filter="drop-shadow(0 15px 30px rgba(29,78,216,0.2))"/>
                <rect x="8" y="12" width="144" height="246" rx="20" fill="#ffffff"/>
                <circle cx="80" cy="25" r="4" fill="#334155"/>
                <text x="80" y="130" font-size="44" text-anchor="middle">💬</text>
                <text x="80" y="180" font-size="14" font-family="sans-serif" font-weight="bold" fill="#1d4ed8" text-anchor="middle">新着通知</text>
            </g>
            <!-- Wi-Fi & Lock Security -->
            <g transform="translate(440, 140)">
                <text x="80" y="60" font-size="48" text-anchor="middle">📶</text>
                <text x="170" y="60" font-size="48" text-anchor="middle">🔒</text>
                <text x="125" y="120" font-size="16" font-family="sans-serif" font-weight="bold" fill="#1d4ed8" text-anchor="middle">個人情報セキュリティ</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#1d4ed8"/>
</svg>
