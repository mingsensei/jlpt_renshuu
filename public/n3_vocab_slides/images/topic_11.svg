<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_topic_11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <filter id="shadow_topic_11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f766e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="24" fill="url(#bg_topic_11)"/>

  <!-- Subtle grid pattern dots -->
  <g opacity="0.15" fill="#0f766e">
    <circle cx="40" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="700" cy="40" r="3"/><circle cx="760" cy="40" r="3"/>
    <circle cx="40" cy="100" r="3"/><circle cx="760" cy="100" r="3"/><circle cx="40" cy="350" r="3"/><circle cx="760" cy="350" r="3"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 35)">
    <rect width="110" height="32" rx="16" fill="#0f766e"/>
    <text x="55" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CHỦ ĐỀ 11</text>
  </g>

  <!-- Title typography -->
  <text x="165" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Du lịch & Đặt phòng khách sạn</text>
  <text x="760" y="58" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="end">旅行・宿泊・温泉</text>

  <!-- Main Illustration Scene -->
  
            <!-- Mount Fuji & Onsen -->
            <polygon points="130,280 260,110 390,280" fill="#0284c7"/>
            <polygon points="220,160 260,110 300,160 280,170 260,165 240,170" fill="#ffffff"/>
            <!-- Onsen steam bowl -->
            <g transform="translate(460, 140)">
                <rect x="0" y="40" width="180" height="110" rx="20" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(15,118,110,0.15))"/>
                <text x="90" y="115" font-size="52" text-anchor="middle">♨️</text>
                <text x="90" y="175" font-size="16" font-family="'Noto Sans JP', sans-serif" font-weight="bold" fill="#0f766e" text-anchor="middle">天然温泉 露天風呂</text>
            </g>
        

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="442" width="800" height="8" fill="#0f766e"/>
</svg>
